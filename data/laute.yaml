# Laute (German phonemes) catalog
# Each entry:
#   slug:       ASCII-only filename-safe identifier (also the .mp3 basename under audio/laute/)
#   label:      display text shown on grid buttons (may contain umlauts)
#   group:      coarse confusion group; used to pad distractors if neighbors run out
#   neighbors:  list of similar-sounding slugs used as distractors in the 3x3 grid
#               (only slugs that also exist in this catalog and have a recorded mp3
#                will actually be used; the rest are silently skipped)

# --- ch family ---------------------------------------------------------------
- slug: ich
  label: "ich"
